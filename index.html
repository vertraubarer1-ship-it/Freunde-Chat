<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexus">
<title>Nexus Chat</title>
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#070b14;--panel:rgba(20,27,45,.82);--line:rgba(255,255,255,.09);
  --primary:#6366f1;--accent:#22d3ee;--green:#10b981;--red:#ef4444;--gold:#f59e0b;
  --txt:#f1f5f9;--muted:#8b98ad;
  --st:env(safe-area-inset-top,20px);--sb:env(safe-area-inset-bottom,16px);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  background:var(--bg);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(900px 600px at 50% -10%,#2b2a6e 0%,transparent 60%),
             radial-gradient(700px 500px at 100% 100%,#0e4a5e 0%,transparent 55%),var(--bg);}
button,input,textarea{font-family:inherit;}button{cursor:pointer;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;
  transform:translate3d(0,0,0) scale(.98);pointer-events:none;
  transition:opacity .32s var(--ease),transform .32s var(--ease);will-change:opacity,transform;}
.screen.active{opacity:1;transform:none;pointer-events:auto;}

.center{display:flex;align-items:center;justify-content:center;padding:22px;height:100%;overflow-y:auto;}
.card{width:100%;max-width:400px;padding:30px 26px;border-radius:28px;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);box-shadow:0 30px 70px rgba(0,0,0,.55);}
.logo{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.5px;
  background:linear-gradient(120deg,#a5b4fc,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{text-align:center;color:var(--muted);font-size:13.5px;margin:6px 0 20px;line-height:1.5;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 0 6px 4px;
  letter-spacing:.3px;text-transform:uppercase;}
.inp{width:100%;padding:13px 16px;border-radius:15px;font-size:16px;color:#fff;outline:none;
  background:rgba(8,12,22,.7);border:1px solid var(--line);
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease);}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(34,211,238,.12);}
.inp:disabled{opacity:.6;}
textarea.inp{min-height:90px;resize:none;line-height:1.45;}
.btn{width:100%;padding:15px;border:none;border-radius:15px;font-size:15.5px;font-weight:700;color:#fff;
  background:linear-gradient(120deg,var(--primary),var(--accent));box-shadow:0 10px 26px rgba(99,102,241,.35);
  margin-top:8px;transition:transform .14s var(--ease),filter .2s;}
.btn:active{transform:scale(.97);filter:brightness(1.1);}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--line);}
.btn.danger{background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.35);color:#fca5a5;box-shadow:none;}
.btn.gold{background:linear-gradient(120deg,#f59e0b,#f97316);box-shadow:0 10px 26px rgba(245,158,11,.3);}
.swap{text-align:center;margin-top:12px;font-size:13px;color:var(--muted);}
.swap b{color:var(--accent);}
.err{color:#fca5a5;font-size:12.5px;text-align:center;margin-top:10px;min-height:16px;line-height:1.4;}
.note{font-size:11px;color:#fbbf24;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);
  border-radius:12px;padding:10px 12px;line-height:1.5;margin-top:14px;text-align:center;}
.codebox{background:rgba(34,211,238,.09);border:1px dashed rgba(34,211,238,.45);border-radius:16px;
  padding:16px;text-align:center;margin:14px 0;}
.codebox .c{font-size:23px;font-weight:800;letter-spacing:3px;color:#67e8f9;font-family:ui-monospace,monospace;}

.topbar{padding:calc(var(--st) + 10px) 18px 12px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(8,12,22,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line);flex-shrink:0;}
.topbar h2{font-size:18px;font-weight:750;letter-spacing:-.3px;display:flex;align-items:center;gap:7px;}
.topbar .me{font-size:11.5px;color:var(--accent);}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);
  color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;
  transition:transform .14s var(--ease),background .2s;}
.iconbtn:active{transform:scale(.9);background:rgba(255,255,255,.14);}
.iconbtn.gold{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.4);}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 28px;}

.tabbar{display:flex;gap:4px;padding:6px;margin:0 16px 14px;border-radius:18px;background:rgba(0,0,0,.35);
  border:1px solid var(--line);position:relative;flex-shrink:0;}
.tab{flex:1;padding:11px 4px;border:none;background:transparent;color:var(--muted);font-size:12.5px;
  font-weight:700;border-radius:14px;z-index:2;transition:color .25s var(--ease);position:relative;}
.tab.on{color:#fff;}
.tabpill{position:absolute;top:6px;bottom:6px;left:6px;background:linear-gradient(120deg,var(--primary),var(--accent));
  border-radius:14px;z-index:1;box-shadow:0 6px 18px rgba(99,102,241,.4);
  transition:transform .34s var(--ease),width .2s;will-change:transform;}
.pane,.subpane{display:none;animation:fade .3s var(--ease);}
.pane.on,.subpane.on{display:block;}
@keyframes fade{from{opacity:0;transform:translate3d(0,8px,0);}to{opacity:1;transform:none;}}

.subbar{display:flex;gap:6px;padding:5px;border-radius:16px;background:rgba(0,0,0,.3);
  border:1px solid var(--line);position:relative;margin-bottom:16px;}
.subtab{flex:1;padding:10px 4px;border:none;background:transparent;color:var(--muted);font-size:12.5px;
  font-weight:700;border-radius:12px;z-index:2;transition:color .25s var(--ease);
  display:flex;align-items:center;justify-content:center;gap:6px;}
.subtab.on{color:#fff;}
.subpill{position:absolute;top:5px;bottom:5px;left:5px;background:rgba(255,255,255,.12);
  border:1px solid var(--line);border-radius:12px;z-index:1;transition:transform .3s var(--ease);}
.badge{min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;
  font-size:10.5px;font-weight:800;display:none;align-items:center;justify-content:center;}
.badge.on{display:flex;}
.badge.float{position:absolute;top:-5px;right:-5px;}

.list{display:flex;flex-direction:column;gap:9px;}
.item{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:17px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  transition:transform .16s var(--ease),background .2s;}
.item:active{transform:scale(.985);background:rgba(255,255,255,.08);}
.avatar{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--accent));}
.avatar.off{background:linear-gradient(135deg,#374151,#4b5563);}
.avatar.gold{background:linear-gradient(135deg,#f59e0b,#f97316);}
.avatar.ban{background:linear-gradient(135deg,#7f1d1d,#991b1b);}
.item .meta{flex:1;min-width:0;}
.item .meta h4{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .meta span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.pill{padding:7px 12px;border-radius:11px;border:none;font-size:12px;font-weight:700;color:#fff;
  background:var(--primary);transition:transform .14s var(--ease);flex-shrink:0;}
.pill:active{transform:scale(.92);}
.pill.gray{background:rgba(255,255,255,.1);}
.pill.green{background:var(--green);}
.pill.red{background:rgba(239,68,68,.22);border:1px solid rgba(239,68,68,.4);color:#fca5a5;}
.pill.gold{background:rgba(245,158,11,.22);border:1px solid rgba(245,158,11,.45);color:#fcd34d;}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:28px 10px;line-height:1.6;}
.secttl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  margin:4px 0 10px 4px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0;}
.dot.off{background:#4b5563;box-shadow:none;}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;}
.stat .n{font-size:28px;font-weight:800;background:linear-gradient(120deg,#a5b4fc,#22d3ee);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-top:3px;}

.logline{font-size:11.5px;color:var(--muted);padding:8px 12px;background:rgba(255,255,255,.035);
  border-radius:11px;border-left:3px solid var(--gold);line-height:1.45;}

#msgs,#modFeed{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;display:flex;
  flex-direction:column;gap:9px;}
.row{display:flex;flex-direction:column;max-width:84%;animation:pop .28s var(--ease) both;}
.row.nofx{animation:none;}
@keyframes pop{from{opacity:0;transform:translate3d(0,12px,0) scale(.97);}to{opacity:1;transform:none;}}
.row.me{align-self:flex-end;align-items:flex-end;}
.row.you{align-self:flex-start;align-items:flex-start;}
.who{font-size:10.5px;color:var(--muted);margin:0 0 3px 5px;}
.bwrap{display:flex;align-items:center;gap:6px;}
.row.me .bwrap{flex-direction:row-reverse;}
.bub{padding:10px 14px;border-radius:19px;font-size:15px;line-height:1.42;word-break:break-word;
  box-shadow:0 6px 20px rgba(0,0,0,.28);}
.row.me .bub{background:linear-gradient(130deg,#5b55e8,#4338ca);border-bottom-right-radius:5px;}
.row.you .bub{background:#1b2436;border:1px solid var(--line);border-bottom-left-radius:5px;}
.stamp{font-size:9.5px;color:rgba(255,255,255,.45);margin-top:3px;text-align:right;}
.quote{background:rgba(0,0,0,.28);border-left:3px solid var(--accent);padding:5px 9px;border-radius:7px;
  font-size:12px;margin-bottom:6px;}
.quote b{color:var(--accent);font-size:11px;display:block;}
.rbtn{opacity:.35;width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.08);
  color:#fff;font-size:12px;transition:opacity .2s,transform .14s;}
.rbtn:active{opacity:1;transform:scale(1.15);}
.bub img,.bub video{width:100%;max-height:280px;border-radius:13px;display:block;margin-top:5px;object-fit:cover;}
.bub audio{width:220px;height:36px;margin-top:5px;}
.sys{align-self:center;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.055);
  padding:5px 13px;border-radius:12px;text-align:center;max-width:90%;}
.sys.admin{color:#fcd34d;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3);}
.divider{align-self:center;font-size:10.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;
  padding:6px 14px;background:rgba(255,255,255,.04);border-radius:10px;margin:4px 0;}

#adminBanner{display:none;padding:8px 16px;background:rgba(245,158,11,.16);
  border-bottom:1px solid rgba(245,158,11,.35);color:#fcd34d;font-size:12px;text-align:center;font-weight:600;}
#adminBanner.on{display:block;animation:fade .3s var(--ease);}

.composer{flex-shrink:0;background:rgba(8,12,22,.93);border-top:1px solid var(--line);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding-bottom:calc(var(--sb) + 6px);}
.bar{display:none;align-items:center;justify-content:space-between;padding:8px 16px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.04);animation:fade .22s var(--ease);}
.bar.on{display:flex;}
.thumb{width:38px;height:38px;border-radius:9px;object-fit:cover;background:#000;display:flex;
  align-items:center;justify-content:center;}
.x{background:none;border:none;color:var(--muted);font-size:17px;padding:4px 6px;}
#tray{display:none;grid-template-columns:repeat(8,1fr);gap:6px;padding:12px 14px;max-height:142px;
  overflow-y:auto;border-bottom:1px solid var(--line);}
#tray.on{display:grid;animation:fade .22s var(--ease);}
#tray span{font-size:24px;text-align:center;transition:transform .13s;}
#tray span:active{transform:scale(1.35);}
.ctrls{display:flex;gap:7px;align-items:center;padding:9px 12px 5px;}
.ctrls .inp{flex:1;border-radius:22px;padding:11px 17px;font-size:15.5px;background:rgba(255,255,255,.075);}
.cbtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform .14s var(--ease),background .2s;}
.cbtn:active{transform:scale(.9);}
.cbtn.send{background:linear-gradient(120deg,var(--primary),var(--accent));box-shadow:0 6px 18px rgba(99,102,241,.4);}
.cbtn.rec{background:var(--red)!important;animation:glow 1s infinite alternate;}
@keyframes glow{from{box-shadow:0 0 4px var(--red);}to{box-shadow:0 0 20px var(--red);}}

#drawer{position:fixed;inset:0;z-index:90;pointer-events:none;background:rgba(0,0,0,0);
  transition:background .3s var(--ease);}
#drawer.on{pointer-events:auto;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);}
#drawer .panel{position:absolute;top:0;right:0;width:272px;height:100%;background:var(--panel);
  border-left:1px solid var(--line);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  padding:calc(var(--st) + 18px) 18px 18px;display:flex;flex-direction:column;gap:14px;
  transform:translate3d(100%,0,0);transition:transform .34s var(--ease);}
#drawer.on .panel{transform:none;}
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);backdrop-filter:blur(5px);padding:22px;}
#modal.on{display:flex;animation:fade .25s var(--ease);}
#blocked{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:#0a0408;padding:28px;text-align:center;flex-direction:column;gap:14px;}
#blocked.on{display:flex;}
::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>

<!-- ===== AUTH ===== -->
<div class="screen active" id="scAuth">
  <div class="center">
    <div class="card">
      <div class="logo">Nexus</div>
      <div class="sub" id="auSub">Melde dich an</div>
      <div class="field"><label>Benutzername</label>
        <input class="inp" id="auUser" placeholder="z. B. alex" maxlength="16" autocapitalize="none" autocomplete="off"></div>
      <div class="field" id="fPass"><label>Passwort</label>
        <input class="inp" id="auPass" type="password" placeholder="••••••••"></div>
      <div class="field" id="fPass2" style="display:none;"><label>Passwort wiederholen</label>
        <input class="inp" id="auPass2" type="password" placeholder="••••••••"></div>
      <div class="field" id="fCode" style="display:none;"><label>Wiederherstellungs-Code</label>
        <input class="inp" id="auCode" placeholder="XXXX-XXXX" autocapitalize="characters"></div>
      <button class="btn" id="auBtn" onclick="submitAuth()">Anmelden</button>
      <div class="err" id="auErr"></div>
      <div class="swap" style="font-size:12px;" id="auReset"></div>
      <div class="note">⚠️ Hobby-Projekt: Die Übertragung läuft über einen öffentlichen Server.
        Bitte
