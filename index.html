<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexus">
<title>Nexus Rooms & Chat</title>
<link rel="manifest" href="manifest.json">

<!-- MQTT Echtzeit-Engine -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>
  :root {
    --bg-dark: #0a0f1d;
    --card-bg: rgba(22, 30, 49, 0.85);
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --accent: #06b6d4;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --bubble-mine: #4f46e5;
    --bubble-other: #1e293b;
    --safe-top: env(safe-area-inset-top, 20px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg-dark) 100%);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* --- LOBBY SCREEN --- */
  #lobby-screen {
    position: fixed; inset: 0; z-index: 50;
    background: radial-gradient(circle at center, #1e1b4b 0%, #060911 100%);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    padding: 28px; border-radius: 28px; width: 100%; max-width: 440px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; max-height: 90vh;
  }
  .card h1 { font-size: 26px; font-weight: 800; text-align: center; margin-bottom: 4px; background: linear-gradient(135deg, #a5b4fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .card p.sub { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 18px; }

  /* TABS */
  .tabs { display: flex; gap: 8px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 16px; margin-bottom: 16px; }
  .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 14px; }
  .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.4); }

  .input-group { margin-bottom: 12px; text-align: left; }
  .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; margin-left: 4px; }
  .card input {
    width: 100%; padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12);
    background: rgba(10, 15, 29, 0.7); color: #fff; font-size: 15px; outline: none; transition: 0.2s;
  }
  .card input:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(6, 182, 212, 0.35); }

  .btn-action {
    width: 100%; padding: 14px; border-radius: 14px; border: none; font-size: 15px; font-weight: 700;
    color: white; background: linear-gradient(135deg, var(--primary), var(--accent));
    cursor: pointer; margin-top: 6px; box-shadow: 0 8px 25px rgba(99,102,241,0.35);
  }

  /* RAUM LISTE */
  #room-list-container { overflow-y: auto; max-height: 220px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding-right: 4px; }
  .room-item {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    padding: 12px 14px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .room-item-info h4 { font-size: 15px; font-weight: 600; }
  .room-item-info span { font-size: 12px; color: var(--accent); }
  .btn-room-join { background: var(--primary); border: none; color: #fff; padding: 6px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }

  /* --- CHAT SCREEN --- */
  header {
    padding-top: calc(var(--safe-top) + 8px);
    padding-bottom: 12px; padding-left: 16px; padding-right: 16px;
    background: rgba(10, 15, 29, 0.85);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; justify-content: space-between; align-items: center; z-index: 20;
  }
  .room-header-left h2 { font-size: 17px; font-weight: 700; color: #fff; }
  .room-header-left p { font-size: 12px; color: var(--accent); }
  .header-actions { display: flex; gap: 8px; }
  .btn-header { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 7px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; cursor: pointer; }

  #chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; animation: popIn 0.2s cubic-bezier(0.1, 1, 0.1, 1); }
  .msg-mine-wrapper { align-self: flex-end; align-items: flex-end; }
  .msg-other-wrapper { align-self: flex-start; align-items: flex-start; }
  .msg-author { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; padding-left: 4px; }

  .msg-bubble { padding: 10px 14px; border-radius: 18px; font-size: 15.5px; line-height: 1.4; word-break: break-word; box-shadow: 0 4px 15px rgba(0,0,0,0.25); }
  .msg-mine { background: linear-gradient(135deg, var(--bubble-mine), #4338ca); color: #fff; border-bottom-right-radius: 4px; }
  .msg-other { background: var(--bubble-other); color: #f1f5f9; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.08); }
  
  .media-msg img, .media-msg video { width: 100%; max-height: 280px; border-radius: 12px; display: block; margin-top: 4px; object-fit: cover; }
  audio { width: 230px; height: 38px; border-radius: 20px; margin-top: 4px; }

  /* INPUT */
  .input-area {
    padding: 10px 14px calc(var(--safe-bottom) + 8px);
    background: rgba(10, 15, 29, 0.95);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 8px; align-items: center;
  }
  .input-area input[type="text"] {
    flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 18px; border-radius: 24px; color: white; font-size: 16px; outline: none;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,0.08);
    color: white; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .send-btn { background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
  .recording { background: #ef4444 !important; animation: pulse 1s infinite alternate; }

  @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes pulse { from { box-shadow: 0 0 5px #ef4444; } to { box-shadow: 0 0 20px #ef4444; } }
</style>
</head>
<body>

<!-- LOBBY / RAUM VERWALTUNG -->
<div id="lobby-screen">
  <div class="card">
    <h1>Nexus Rooms</h1>
    <p class="sub">Erstelle Räume oder trete deinen Freunden bei</p>

    <!-- NICKNAME -->
    <div class="input-group">
      <label>Dein Spitzname</label>
      <input type="text" id="username" placeholder="z. B. Sam" maxlength="15">
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab-btn active" id="tabCreateBtn" onclick="switchTab('create')">➕ Raum erstellen</button>
      <button class="tab-btn" id="tabJoinBtn" onclick="switchTab('join')">🔍 Räume & Beitritt</button>
    </div>

    <!-- TAB 1: ERSTELLEN -->
    <div id="tab-create">
      <div class="input-group">
        <label>Raum-Name</label>
        <input type="text" id="newRoomName" placeholder="z. B. GamerLounge" maxlength="20">
      </div>
      <div class="input-group">
        <label>Passwort 🔒 (optional)</label>
        <input type="password" id="newRoomPass" placeholder="Leer lassen für öffentlich">
      </div>
      <button class="btn-action" onclick="createRoom()">Raum jetzt erstellen & starten 🚀</button>
    </div>

    <!-- TAB 2: BEITRETEN & LISTE -->
    <div id="tab-join" style="display:none;">
      <div class="input-group">
        <label>Direkt-Beitritt (Raumname & Passwort)</label>
        <div style="display:flex; gap:6px;">
          <input type="text" id="directRoomName" placeholder="Raumname">
          <input type="password" id="directRoomPass" placeholder="Passwort">
        </div>
      </div>
      <button class="btn-action" style="margin-bottom:12px;" onclick="joinDirect()">Beitreten ➔</button>

      <label style="font-size:12px; font-weight:600; color:var(--text-muted); text-align:left;">Aktive Live-Räume:</label>
      <div id="room-list-container">
        <div style="font-size:13px; color:var(--text-muted); text-align:center; padding:15px;">Suche nach Räumen...</div>
      </div>
    </div>
  </div>
</div>

<!-- CHAT SCREEN -->
<header>
  <div class="room-header-left">
    <h2 id="display-room">🔒 Raum</h2>
    <p>● Live & Verschlüsselt</p>
  </div>
  <div class="header-actions">
    <button class="btn-header" onclick="copyInviteLink()">🔗 Einladen</button>
    <button class="btn-header" onclick="location.reload()">Lobby</button>
  </div>
</header>

<div id="chat-messages"></div>

<div class="input-area">
  <button class="icon-btn" onclick="document.getElementById('fileIn').click()">📎</button>
  <input type="file" id="fileIn" accept="image/*,video/*" style="display:none;" onchange="handleFile(this)">

  <input type="text" id="msgIn" placeholder="Nachricht schreiben..." autocomplete="off" onkeydown="if(event.key==='Enter') sendText()">

  <button class="icon-btn" id="voiceBtn" onclick="toggleVoice()">🎙</button>
  <button class="icon-btn send-btn" onclick="sendText()">➤</button>
</div>

<script>
  let client = null;
  let lobbyClient = null;
  let topic = "";
  let currentUser = "";
  let currentRoom = "";
  let currentPass = "";
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let discoveredRooms = {};

  const LOBBY_TOPIC = "nexus_v4/global_lobby_list";

  // Initiale Verbindung zur Lobby für Raumliste
  lobbyClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
  lobbyClient.on('connect', () => {
    lobbyClient.subscribe(LOBBY_TOPIC);
    lobbyClient.publish(LOBBY_TOPIC, JSON.stringify({ type: 'ping' }));
  });

  lobbyClient.on('message', (t, payload) => {
    try {
      const data = JSON.parse(payload.toString());
      if(data.type === 'announce_room') {
        discoveredRooms[data.room] = { hasPass: data.hasPass, time: Date.now() };
        renderRoomList();
      }
    } catch(e){}
  });

  function switchTab(tab) {
    document.getElementById('tab-create').style.display = tab === 'create' ? 'block' : 'none';
    document.getElementById('tab-join').style.display = tab === 'join' ? 'block' : 'none';
    document.getElementById('tabCreateBtn').className = `tab-btn ${tab === 'create' ? 'active' : ''}`;
    document.getElementById('tabJoinBtn').className = `tab-btn ${tab === 'join' ? 'active' : ''}`;
  }

  function renderRoomList() {
    const list = document.getElementById('room-list-container');
    const rooms = Object.keys(discoveredRooms);
    if(rooms.length === 0) {
      list.innerHTML = `<div style="font-size:13px; color:var(--text-muted); text-align:center; padding:15px;">Noch keine Räume offen. Erstelle den ersten!</div>`;
      return;
    }
    list.innerHTML = "";
    rooms.forEach(r => {
      const info = discoveredRooms[r];
      const div = document.createElement('div');
      div.className = 'room-item';
      div.innerHTML = `
        <div class="room-item-info">
          <h4>${info.hasPass ? '🔒' : '🌐'} ${escapeHtml(r)}</h4>
          <span>${info.hasPass ? 'Passwortgeschützt' : 'Öffentlich'}</span>
        </div>
        <button class="btn-room-join" onclick="selectFromList('${escapeHtml(r)}', ${info.hasPass})">Beitreten</button>
      `;
      list.appendChild(div);
    });
  }

  function selectFromList(room, hasPass) {
    let pass = "";
    if(hasPass) {
      pass = prompt("Gib das Passwort für Raum '" + room + "' ein:");
      if(pass === null) return;
    }
    document.getElementById('directRoomName').value = room;
    document.getElementById('directRoomPass').value = pass;
    joinDirect();
  }

  async function hash(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 20);
  }

  async function createRoom() {
    const user = document.getElementById('username').value.trim();
    const room = document.getElementById('newRoomName').value.trim().toLowerCase();
    const pass = document.getElementById('newRoomPass').value;

    if(!user || !room) {
      alert("Bitte gib deinen Namen und einen Raumnamen ein!");
      return;
    }
    startChat(user, room, pass);
  }

  async function joinDirect() {
    const user = document.getElementById('username').value.trim();
    const room = document.getElementById('directRoomName').value.trim().toLowerCase();
    const pass = document.getElementById('directRoomPass').value;

    if(!user || !room) {
      alert("Bitte gib deinen Namen und den Raumnamen ein!");
      return;
    }
    startChat(user, room, pass);
  }

  async function startChat(user, room, pass) {
    currentUser = user;
    currentRoom = room;
    currentPass = pass;

    const roomHash = await hash(room + "____" + pass);
    topic = "nexus_v4/room/" + roomHash;

    document.getElementById('display-room').textContent = (pass ? '🔒 ' : '🌐 ') + room;
    document.getElementById('lobby-screen').style.display = "none";

    client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    client.on('connect', () => {
      client.subscribe(topic);
      broadcast({ type: 'sys', text: `${currentUser} ist beigetreten 👋` });
      
      // Kündige den Raum in der Lobby an
      lobbyClient.publish(LOBBY_TOPIC, JSON.stringify({
        type: 'announce_room',
        room: room,
        hasPass: !!pass
      }));
    });

    client.on('message', (t, payload) => {
      if(t === topic) {
        try {
          renderMessage(JSON.parse(payload.toString()));
        } catch(e){}
      }
    });
  }

  function copyInviteLink() {
    const url = window.location.origin + window.location.pathname + `?room=${encodeURIComponent(currentRoom)}`;
    navigator.clipboard.writeText(url).then(() => {
      alert("Einladungslink in Zwischenablage kopiert! Schicke ihn deinem Freund.");
    }).catch(() => {
      prompt("Kopiere diesen Link für deine Freunde:", url);
    });
  }

  // URL-Parameter prüfen (für schnelles Beitreten per Link)
  window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);
    const roomParam = params.get('room');
    if(roomParam) {
      switchTab('join');
      document.getElementById('directRoomName').value = roomParam;
    }
  });

  function broadcast(data) {
    if(!client) return;
    data.sender = currentUser;
    data.time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    client.publish(topic, JSON.stringify(data));
  }

  function sendText() {
    const input = document.getElementById('msgIn');
    const val = input.value.trim();
    if(!val) return;
    broadcast({ type: 'text', text: val });
    input.value = "";
  }

  function handleFile(input) {
    const file = input.files[0];
    if(!file) return;

    if(file.type.startsWith('image/')) {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => {
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDim = 1000;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          broadcast({ type: 'image', mediaUrl: canvas.toDataURL('image/jpeg', 0.7) });
        };
      };
      reader.readAsDataURL(file);
    } else if(file.type.startsWith('video/')) {
      if(file.size > 5 * 1024 * 1024) { alert("Video darf max. 5MB groß sein!"); return; }
      const reader = new FileReader();
      reader.onload = (e) => broadcast({ type: 'video', mediaUrl: e.target.result });
      reader.readAsDataURL(file);
    }
    input.value = "";
  }

  async function toggleVoice() {
    const btn = document.getElementById('voiceBtn');
    if(!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const options = MediaRecorder.isTypeSupported('audio/mp4') ? { mimeType: 'audio/mp4' } : {};
        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/mp4' });
          const reader = new FileReader();
          reader.onload = () => broadcast({ type: 'audio', mediaUrl: reader.result });
          reader.readAsDataURL(blob);
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        isRecording = true;
        btn.classList.add('recording');
        btn.textContent = "⏹";
      } catch(err) {
        alert("Mikrofon-Zugriff verweigert!");
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      btn.classList.remove('recording');
      btn.textContent = "🎙";
    }
  }

  function renderMessage(data) {
    const box = document.getElementById('chat-messages');
    const isMine = data.sender === currentUser;

    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper ${isMine ? 'msg-mine-wrapper' : 'msg-other-wrapper'}`;

    if(data.type === 'sys') {
      wrapper.style.alignSelf = 'center';
      wrapper.innerHTML = `<span style="font-size:12px; color:var(--text-muted); background:rgba(255,255,255,0.06); padding:4px 12px; border-radius:12px;">${escapeHtml(data.text)}</span>`;
      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
      return;
    }

    let content = "";
    if(data.type === 'text') {
      content = `<div>${escapeHtml(data.text)}</div>`;
    } else if(data.type === 'image') {
      content = `<div class="media-msg"><img src="${data.mediaUrl}"></div>`;
    } else if(data.type === 'video') {
      content = `<div class="media-msg"><video src="${data.mediaUrl}" controls playsinline></video></div>`;
    } else if(data.type === 'audio') {
      content = `<div>🎙 Sprachnachricht<br><audio src="${data.mediaUrl}" controls playsinline></audio></div>`;
    }

    wrapper.innerHTML = `
      ${!isMine ? `<div class="msg-author">${escapeHtml(data.sender)} • ${data.time}</div>` : ''}
      <div class="msg-bubble ${isMine ? 'msg-mine' : 'msg-other'}">
        ${content}
      </div>
    `;

    box.appendChild(wrapper);
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>

</body>
</html>
