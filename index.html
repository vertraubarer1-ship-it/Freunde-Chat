<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <!-- WICHTIG FÜR IPAD: Macht es zu einer echten App auf dem Home-Screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MeineChatApp">
    
    <link rel="manifest" href="manifest.json">
    <title>Chat App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; background-color: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        #chat-header { background-color: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; padding-top: 40px; } /* Padding-top fürs iPad */
        #chat-box { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background-color: white; padding: 10px; border-radius: 10px; max-width: 70%; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .my-message { background-color: #dcf8c6; align-self: flex-end; }
        #input-area { display: flex; padding: 10px; background-color: #f0f0f0; align-items: center; gap: 10px; padding-bottom: 30px; } /* Padding-bottom fürs iPad */
        input[type="text"] { flex: 1; padding: 12px; border-radius: 20px; border: none; outline: none; }
        button { background-color: #128c7e; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; }
        .media-btn { background-color: #ccc; }
    </style>
</head>
<body>

    <div id="chat-header">
        Freunde Chat 💬
    </div>

    <div id="chat-box">
        <!-- Beispielnachrichten -->
        <div class="message">Hey, wie geht's?</div>
        <div class="message my-message">Alles super! Schau mal dieses Bild! 📷</div>
    </div>

    <div id="input-area">
        <!-- Kamera/Bilder Button -->
        <button class="media-btn" onclick="document.getElementById('file-upload').click()">📎</button>
        <input type="file" id="file-upload" style="display: none;" accept="image/*,video/*">
        
        <!-- Text Eingabe -->
        <input type="text" id="message-input" placeholder="Nachricht schreiben...">
        
        <!-- Sprachnachricht Button -->
        <button class="media-btn" id="record-btn">🎤</button>
        
        <!-- Senden Button -->
        <button id="send-btn">➤</button>
    </div>

    <script>
        // Einfache Senden-Funktion für das Design
        document.getElementById('send-btn').addEventListener('click', function() {
            let input = document.getElementById('message-input');
            let chatBox = document.getElementById('chat-box');
            
            if(input.value.trim() !== "") {
                let msgDiv = document.createElement('div');
                msgDiv.className = 'message my-message';
                msgDiv.textContent = input.value;
                chatBox.appendChild(msgDiv);
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        });
    </script>
</body>
</html>
