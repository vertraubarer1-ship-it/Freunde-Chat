<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexus">
<title>Nexus Chat</title>
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#070b14;--panel:rgba(20,27,45,.82);--line:rgba(255,255,255,.09);
  --primary:#6366f1;--accent:#22d3ee;--green:#10b981;--red:#ef4444;
  --txt:#f1f5f9;--muted:#8b98ad;
  --st:env(safe-area-inset-top,20px);--sb:env(safe-area-inset-bottom,16px);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  background:var(--bg);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(900px 600px at 50% -10%,#2b2a6e 0%,transparent 60%),
             radial-gradient(700px 500px at 100% 100%,#0e4a5e 0%,transparent 55%),var(--bg);}
button,input{font-family:inherit;}button{cursor:pointer;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;
  transform:translate3d(0,0,0) scale(.98);pointer-events:none;
  transition:opacity .32s var(--ease),transform .32s var(--ease);will-change:opacity,transform;}
.screen.active{opacity:1;transform:translate3d(0,0,0) scale(1);pointer-events:auto;}

.center{display:flex;align-items:center;justify-content:center;padding:22px;height:100%;overflow-y:auto;}
.card{width:100%;max-width:400px;padding:30px 26px;border-radius:28px;background:var(--panel);
  border:1px solid var(--line);backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);box-shadow:0 30px 70px rgba(0,0,0,.55);}
.logo{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.5px;
  background:linear-gradient(120deg,#a5b4fc,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{text-align:center;color:var(--muted);font-size:13.5px;margin:6px 0 22px;line-height:1.5;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 0 6px 4px;
  letter-spacing:.3px;text-transform:uppercase;}
.inp{width:100%;padding:13px 16px;border-radius:15px;font-size:16px;color:#fff;outline:none;
  background:rgba(8,12,22,.7);border:1px solid var(--line);
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease);}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(34,211,238,.12);}
.inp:disabled{opacity:.6;}
.btn{width:100%;padding:15px;border:none;border-radius:15px;font-size:15.5px;font-weight:700;color:#fff;
  background:linear-gradient(120deg,var(--primary),var(--accent));box-shadow:0 10px 26px rgba(99,102,241,.35);
  margin-top:8px;transition:transform .14s var(--ease),filter .2s;}
.btn:active{transform:scale(.97);filter:brightness(1.1);}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--line);}
.btn.danger{background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.35);color:#fca5a5;box-shadow:none;}
.swap{text-align:center;margin-top:14px;font-size:13.5px;color:var(--muted);}
.swap b{color:var(--accent);}
.err{color:#fca5a5;font-size:12.5px;text-align:center;margin-top:10px;min-height:16px;line-height:1.4;}
.ok{color:#6ee7b7;}

.codebox{background:rgba(34,211,238,.09);border:1px dashed rgba(34,211,238,.45);border-radius:16px;
  padding:16px;text-align:center;margin:14px 0;}
.codebox .c{font-size:23px;font-weight:800;letter-spacing:3px;color:#67e8f9;font-family:ui-monospace,monospace;}

.topbar{padding:calc(var(--st) + 10px) 18px 12px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(8,12,22,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line);flex-shrink:0;}
.topbar h2{font-size:18px;font-weight:750;letter-spacing:-.3px;}
.topbar .me{font-size:11.5px;color:var(--accent);}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);
  color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;
  transition:transform .14s var(--ease),background .2s;}
.iconbtn:active{transform:scale(.9);background:rgba(255,255,255,.14);}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 24px;}

.tabbar{display:flex;gap:4px;padding:6px;margin:0 16px 14px;border-radius:18px;background:rgba(0,0,0,.35);
  border:1px solid var(--line);position:relative;flex-shrink:0;}
.tab{flex:1;padding:11px 4px;border:none;background:transparent;color:var(--muted);font-size:12.5px;
  font-weight:700;border-radius:14px;z-index:2;transition:color .25s var(--ease);}
.tab.on{color:#fff;}
.tabpill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);
  background:linear-gradient(120deg,var(--primary),var(--accent));border-radius:14px;z-index:1;
  box-shadow:0 6px 18px rgba(99,102,241,.4);transition:transform .34s var(--ease);will-change:transform;}
.pane{display:none;animation:fade .3s var(--ease);}
.pane.on{display:block;}
@keyframes fade{from{opacity:0;transform:translate3d(0,8px,0);}to{opacity:1;transform:none;}}

.list{display:flex;flex-direction:column;gap:9px;}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:17px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  transition:transform .16s var(--ease),background .2s;}
.item:active{transform:scale(.985);background:rgba(255,255,255,.08);}
.avatar{width:42px;height:42px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:16px;color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--accent));}
.avatar.off{background:linear-gradient(135deg,#374151,#4b5563);}
.item .meta{flex:1;min-width:0;}
.item .meta h4{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .meta span{font-size:11.5px;color:var(--muted);}
.pill{padding:7px 14px;border-radius:11px;border:none;font-size:12px;font-weight:700;color:#fff;
  background:var(--primary);transition:transform .14s var(--ease);}
.pill:active{transform:scale(.92);}
.pill.gray{background:rgba(255,255,255,.1);}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;line-height:1.6;}
.secttl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  margin:4px 0 10px 4px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0;}
.dot.off{background:#4b5563;box-shadow:none;}

#msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;display:flex;
  flex-direction:column;gap:9px;}
.row{display:flex;flex-direction:column;max-width:84%;animation:pop .28s var(--ease) both;}
@keyframes pop{from{opacity:0;transform:translate3d(0,12px,0) scale(.97);}to{opacity:1;transform:none;}}
.row.me{align-self:flex-end;align-items:flex-end;}
.row.you{align-self:flex-start;align-items:flex-start;}
.who{font-size:10.5px;color:var(--muted);margin:0 0 3px 5px;}
.bwrap{display:flex;align-items:center;gap:6px;}
.row.me .bwrap{flex-direction:row-reverse;}
.bub{padding:10px 14px;border-radius:19px;font-size:15px;line-height:1.42;word-break:break-word;
  box-shadow:0 6px 20px rgba(0,0,0,.28);}
.row.me .bub{background:linear-gradient(130deg,#5b55e8,#4338ca);border-bottom-right-radius:5px;}
.row.you .bub{background:#1b2436;border:1px solid var(--line);border-bottom-left-radius:5px;}
.quote{background:rgba(0,0,0,.28);border-left:3px solid var(--accent);padding:5px 9px;border-radius:7px;
  font-size:12px;margin-bottom:6px;}
.quote b{color:var(--accent);font-size:11px;display:block;}
.rbtn{opacity:.35;width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.08);
  color:#fff;font-size:12px;transition:opacity .2s,transform .14s;}
.rbtn:active{opacity:1;transform:scale(1.15);}
.bub img,.bub video{width:100%;max-height:280px;border-radius:13px;display:block;margin-top:5px;object-fit:cover;}
.bub audio{width:220px;height:36px;margin-top:5px;}
.sys{align-self:center;font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.055);
  padding:5px 13px;border-radius:12px;animation:pop .28s var(--ease);}

.composer{flex-shrink:0;background:rgba(8,12,22,.93);border-top:1px solid var(--line);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding-bottom:calc(var(--sb) + 6px);}
.bar{display:none;align-items:center;justify-content:space-between;padding:8px 16px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.04);animation:fade .22s var(--ease);}
.bar.on{display:flex;}
.thumb{width:38px;height:38px;border-radius:9px;object-fit:cover;background:#000;display:flex;
  align-items:center;justify-content:center;}
.x{background:none;border:none;color:var(--muted);font-size:17px;padding:4px 6px;}
#tray{display:none;grid-template-columns:repeat(8,1fr);gap:6px;padding:12px 14px;max-height:142px;
  overflow-y:auto;border-bottom:1px solid var(--line);}
#tray.on{display:grid;animation:fade .22s var(--ease);}
#tray span{font-size:24px;text-align:center;transition:transform .13s;}
#tray span:active{transform:scale(1.35);}
.ctrls{display:flex;gap:7px;align-items:center;padding:9px 12px 5px;}
.ctrls .inp{flex:1;border-radius:22px;padding:11px 17px;font-size:15.5px;background:rgba(255,255,255,.075);}
.cbtn{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:#fff;
  font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform .14s var(--ease),background .2s;}
.cbtn:active{transform:scale(.9);}
.cbtn.send{background:linear-gradient(120deg,var(--primary),var(--accent));box-shadow:0 6px 18px rgba(99,102,241,.4);}
.cbtn.rec{background:var(--red)!important;animation:glow 1s infinite alternate;}
@keyframes glow{from{box-shadow:0 0 4px var(--red);}to{box-shadow:0 0 20px var(--red);}}

#drawer{position:fixed;inset:0;z-index:90;pointer-events:none;background:rgba(0,0,0,0);
  transition:background .3s var(--ease);}
#drawer.on{pointer-events:auto;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);}
#drawer .panel{position:absolute;top:0;right:0;width:270px;height:100%;background:var(--panel);
  border-left:1px solid var(--line);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  padding:calc(var(--st) + 18px) 18px 18px;display:flex;flex-direction:column;gap:14px;
  transform:translate3d(100%,0,0);transition:transform .34s var(--ease);}
#drawer.on .panel{transform:translate3d(0,0,0);}

#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);backdrop-filter:blur(5px);padding:22px;}
#modal.on{display:flex;animation:fade .25s var(--ease);}
#modal .card{animation:pop .3s var(--ease);}
::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>

<!-- ===== AUTH ===== -->
<div class="screen active" id="scAuth">
  <div class="center">
    <div class="card">
      <div class="logo">Nexus</div>
      <div class="sub" id="auSub">Melde dich an</div>

      <div class="field">
        <label>Benutzername</label>
        <input class="inp" id="auUser" placeholder="z. B. alex" maxlength="16" autocapitalize="none" autocomplete="off">
      </div>
      <div class="field" id="fPass">
        <label>Passwort</label>
        <input class="inp" id="auPass" type="password" placeholder="••••••••">
      </div>
      <div class="field" id="fPass2" style="display:none;">
        <label>Passwort wiederholen</label>
        <input class="inp" id="auPass2" type="password" placeholder="••••••••">
      </div>
      <div class="field" id="fCode" style="display:none;">
        <label>Wiederherstellungs-Code</label>
        <input class="inp" id="auCode" placeholder="XXXX-XXXX" autocapitalize="characters">
      </div>

      <button class="btn" id="auBtn" onclick="submitAuth()">Anmelden</button>
      <div class="err" id="auErr"></div>

      <div class="swap" id="auSwap"></div>
      <div class="swap" style="margin-top:8px;font-size:12px;" id="auReset"></div>
    </div>
  </div>
</div>

<!-- ===== HOME ===== -->
<div class="screen" id="scHome">
  <div class="topbar">
    <div>
      <h2>Nexus</h2>
      <div class="me" id="meLabel">● online</div>
    </div>
    <div style="display:flex;gap:7px;">
      <button class="iconbtn" onclick="showRecovery()" title="Sicherheit">🔑</button>
      <button class="iconbtn" onclick="logout()" title="Abmelden">⏻</button>
    </div>
  </div>

  <div class="tabbar">
    <div class="tabpill" id="pill"></div>
    <button class="tab on" onclick="setTab(0)">Erstellen</button>
    <button class="tab" onclick="setTab(1)">Beitreten</button>
    <button class="tab" onclick="setTab(2)">Chats</button>
  </div>

  <div class="body">
    <!-- RAUM ERSTELLEN -->
    <div class="pane on" id="pane0">
      <div class="field"><label>Raum-Name</label>
        <input class="inp" id="crName" placeholder="z. B. Gaming-Lounge" maxlength="22"></div>
      <div class="field"><label>Passwort (optional)</label>
        <input class="inp" id="crPass" type="password" placeholder="Leer = öffentlich"></div>
      <button class="btn" onclick="createRoom()">Raum erstellen & betreten</button>
    </div>

    <!-- RAUM BEITRETEN -->
    <div class="pane" id="pane1">
      <div class="field"><label>Raum-Name</label>
        <input class="inp" id="jnName" placeholder="Name des Raums" maxlength="22"></div>
      <div class="field"><label>Passwort (falls nötig)</label>
        <input class="inp" id="jnPass" type="password" placeholder="••••••••"></div>
      <button class="btn" onclick="joinTyped()">Beitreten</button>
      <div class="secttl" style="margin-top:22px;">Aktive Räume</div>
      <div class="list" id="roomList"><div class="empty">Suche nach Räumen…</div></div>
    </div>

    <!-- CHATS / FREUNDE -->
    <div class="pane" id="pane2">
      <button class="btn" onclick="addFriendPrompt()">+ Freund hinzufügen</button>
      <div class="secttl" style="margin-top:20px;">Meine Freunde</div>
      <div class="list" id="friendList"></div>
      <div class="secttl" style="margin-top:20px;">Weitere Nutzer online</div>
      <div class="list" id="userList"></div>
    </div>
  </div>
</div>

<!-- ===== CHAT ===== -->
<div class="screen" id="scChat">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:11px;min-width:0;">
      <button class="iconbtn" onclick="leaveChat()">‹</button>
      <div style="min-width:0;" onclick="openDrawer(true)">
        <h2 id="chTitle" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;">Chat</h2>
        <div class="me" id="chSub">● verbunden</div>
      </div>
    </div>
    <div style="display:flex;gap:7px;">
      <button class="iconbtn" id="btnMembers" onclick="openDrawer(true)">👥</button>
      <button class="iconbtn" onclick="leaveChat()" style="background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.3);">🚪</button>
    </div>
  </div>

  <div id="msgs"></div>

  <div class="composer">
    <div class="bar" id="replyBar">
      <div style="display:flex;align-items:center;gap:10px;min-width:0;">
        <span style="font-size:15px;">↩︎</span>
        <div style="min-width:0;">
          <div style="font-size:11px;color:var(--accent);font-weight:700;" id="rpWho"></div>
          <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw;" id="rpTxt"></div>
        </div>
      </div>
      <button class="x" onclick="cancelReply()">✕</button>
    </div>
    <div class="bar" id="attBar">
      <div style="display:flex;align-items:center;gap:10px;">
        <div id="attThumb"></div>
        <div><div style="font-size:12px;font-weight:700;" id="attName">Datei</div>
          <div style="font-size:11px;color:var(--muted);">Bereit zum Senden</div></div>
      </div>
      <button class="x" onclick="cancelAtt()">✕</button>
    </div>
    <div id="tray"></div>
    <div class="ctrls">
      <button class="cbtn" onclick="fileIn.click()">📎</button>
      <input type="file" id="fileIn" accept="image/*,video/*" hidden onchange="pickFile(this)">
      <button class="cbtn" onclick="tray.classList.toggle('on')">😀</button>
      <input class="inp" id="msgIn" placeholder="Nachricht…" autocomplete="off" oninput="typingPing()" onkeydown="if(event.key==='Enter')send()">
      <button class="cbtn" id="micBtn" onclick="toggleMic()">🎙</button>
      <button class="cbtn send" onclick="send()">➤</button>
    </div>
  </div>
</div>

<!-- DRAWER -->
<div id="drawer" onclick="openDrawer(false)">
  <div class="panel" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;">
      <h3 style="font-size:16px;">Teilnehmer</h3>
      <button class="x" style="font-size:18px;" onclick="openDrawer(false)">✕</button>
    </div>
    <div class="list" id="memList" style="overflow-y:auto;"></div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" onclick="closeModal()">
  <div class="card" onclick="event.stopPropagation()" id="modalCard"></div>
</div>

<script>
/* ===== KONFIG ===== */
const BROKER='wss://broker.emqx.io:8084/mqtt';
const NS='nexusx2';
const T_PRES=NS+'/presence', T_ROOMS=NS+'/rooms', T_FRIEND=NS+'/friend';
const EMO=["😀","😂","🥹","😍","😎","🤔","😴","🥳","😭","😡","👍","🙏","👏","🔥","❤️","✨","💯","🎉","🚀","⚡","🍕","🎮","👀","💀"];

/* ===== STATE ===== */
let me='',net=null,chatTopic='',chatMode='',rooms=new Map(),users=new Map(),members=new Map();
let friends=[],reply=null,att=null,rec=null,chunks=[],recording=false,tTimer=null,hb=null;
const $=id=>document.getElementById(id);
const tray=$('tray'),fileIn=$('fileIn');
EMO.forEach(e=>{const s=document.createElement('span');s.textContent=e;
  s.onclick=()=>{$('msgIn').value+=e;$('msgIn').focus();};tray.appendChild(s);});

const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,24);}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}

/* ===== KONTO (nur 1 pro Gerät) ===== */
const ACC=()=>JSON.parse(localStorage.getItem('nx_acc')||'null');
const setACC=a=>localStorage.setItem('nx_acc',JSON.stringify(a));
const getFriends=()=>JSON.parse(localStorage.getItem('nx_friends')||'[]');
const setFriends=f=>localStorage.setItem('nx_friends',JSON.stringify(f));

let mode='login'; // login | register | reset

function renderAuth(){
  const a=ACC();
  $('auErr').textContent='';
  if(!a){ mode='register'; }
  const reg=mode==='register', res=mode==='reset';
  $('fPass2').style.display=reg?'block':'none';
  $('fCode').style.display=res?'block':'none';
  $('auUser').disabled=!!a;
  if(a)$('auUser').value=a.u;
  $('auBtn').textContent=reg?'Konto erstellen':(res?'Passwort zurücksetzen':'Anmelden');
  $('auSub').textContent=reg?'Erstelle dein Konto — pro Gerät ist nur ein Konto möglich.'
    :(res?'Gib deinen Wiederherstellungs-Code ein.':'Willkommen zurück!');
  $('fPass').querySelector('label').textContent=res?'Neues Passwort':'Passwort';
  $('auSwap').innerHTML = a ? '' : '';
  $('auReset').innerHTML = a ? (res
    ? '<b onclick="mode=\'login\';renderAuth()">Zurück zur Anmeldung</b>'
    : '<b onclick="mode=\'reset\';renderAuth()">Passwort vergessen?</b>') : '';
}

function makeCode(){
  const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<8;i++){s+=C[Math.floor(Math.random()*C.length)];if(i===3)s+='-';}
  return s;
}

async function submitAuth(){
  const u=$('auUser').value.trim().toLowerCase(),p=$('auPass').value,err=$('auErr');
  err.textContent='';err.className='err';
  if(!/^[a-z0-9_]{3,16}$/.test(u))return err.textContent='Name: 3–16 Zeichen (a–z, 0–9, _)';
  if(p.length<4)return err.textContent='Passwort: mindestens 4 Zeichen';
  const a=ACC();

  if(mode==='register'){
    if(a)return err.textContent='Auf diesem Gerät existiert bereits ein Konto.';
    if($('auPass2').value!==p)return err.textContent='Passwörter stimmen nicht überein';
    const code=makeCode();
    setACC({u,h:await sha(u+'::'+p),rc:await sha(u+'::'+code)});
    modalCode(code,()=>boot(u));
    return;
  }
  if(mode==='reset'){
    const c=$('auCode').value.trim().toUpperCase();
    if(await sha(a.u+'::'+c)!==a.rc)return err.textContent='Wiederherstellungs-Code ist falsch.';
    const nc=makeCode();
    setACC({u:a.u,h:await sha(a.u+'::'+p),rc:await sha(a.u+'::'+nc)});
    modalCode(nc,()=>{mode='login';renderAuth();err.className='err ok';err.textContent='Passwort geändert!';});
    return;
  }
  // login
  if(!a)return err.textContent='Kein Konto vorhanden.';
  if(await sha(a.u+'::'+p)!==a.h)return err.textContent='Falsches Passwort.';
  boot(a.u);
}

function modalCode(code,cb){
  $('modalCard').innerHTML=`
    <div class="logo" style="font-size:22px;">Wiederherstellungs-Code</div>
    <div class="sub">Schreibe diesen Code auf!<br>Nur damit kannst du dein Passwort zurücksetzen.</div>
    <div class="codebox"><div class="c">${code}</div></div>
    <button class="btn ghost" onclick="navigator.clipboard&&navigator.clipboard.writeText('${code}');this.textContent='Kopiert ✓'">Code kopieren</button>
    <button class="btn" id="mOk">Ich habe ihn notiert</button>`;
  $('modal').classList.add('on');
  $('mOk').onclick=()=>{closeModal();cb&&cb();};
}
function closeModal(){$('modal').classList.remove('on');}
function showRecovery(){
  $('modalCard').innerHTML=`
    <div class="logo" style="font-size:22px;">Sicherheit</div>
    <div class="sub">Konto: <b style="color:#fff">${esc(me)}</b><br>
    Dein alter Code bleibt gültig. Du kannst hier einen neuen erzeugen.</div>
    <button class="btn" id="mNew">Neuen Code erzeugen</button>
    <button class="btn danger" id="mDel">Konto löschen</button>
    <button class="btn ghost" onclick="closeModal()">Schließen</button>`;
  $('modal').classList.add('on');
  $('mNew').onclick=async()=>{const a=ACC(),c=makeCode();
    setACC({...a,rc:await sha(a.u+'::'+c)});modalCode(c);};
  $('mDel').onclick=()=>{if(confirm('Konto und alle Freunde wirklich löschen?')){
    localStorage.clear();location.reload();}};
}
function logout(){sessionStorage.removeItem('nx_in');location.reload();}

window.addEventListener('load',()=>{renderAuth();});

/* ===== BOOT ===== */
function boot(user){
  me=user;friends=getFriends();
  $('meLabel').textContent='● '+me+' · online';
  show('scHome');drawFriends();
  net=mqtt.connect(BROKER,{clean:true,reconnectPeriod:2000});
  net.on('connect',()=>{net.subscribe([T_PRES,T_ROOMS,T_FRIEND]);ping();hb=setInterval(ping,9000);});
  net.on('message',(t,pl)=>{
    let d;try{d=JSON.parse(pl.toString())}catch(e){return}
    if(t===T_PRES){if(d.u&&d.u!==me){users.set(d.u,Date.now());drawUsers();drawFriends();}}
    else if(t===T_ROOMS){if(d.name){rooms.set(d.name.toLowerCase(),{name:d.name,lock:!!d.lock,t:Date.now()});drawRooms();}}
    else if(t===T_FRIEND){
      if(d.to===me&&d.from&&!friends.includes(d.from)){
        friends.push(d.from);setFriends(friends);drawFriends();
        sysToast(d.from+' hat dich als Freund hinzugefügt');
      }
    }
    else if(t===chatTopic)onChat(d);
  });
  setInterval(()=>{const n=Date.now();
    users.forEach((v,k)=>{if(n-v>30000)users.delete(k)});
    rooms.forEach((v,k)=>{if(n-v.t>70000)rooms.delete(k)});
    members.forEach((v,k)=>{if(k!==me&&n-v>45000)members.delete(k)});
    drawUsers();drawRooms();drawFriends();drawMembers();},8000);
}
function ping(){if(net&&net.connected)net.publish(T_PRES,JSON.stringify({u:me}));}
function sysToast(t){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:50%;top:calc(var(--st) + 60px);transform:translateX(-50%);z-index:120;background:rgba(34,211,238,.18);border:1px solid rgba(34,211,238,.4);color:#a5f3fc;padding:10px 18px;border-radius:14px;font-size:13px;backdrop-filter:blur(10px);animation:pop .3s var(--ease)';
  d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500);
}

/* ===== TABS ===== */
function setTab(i){
  document.querySelectorAll('.tab').forEach((t,n)=>t.classList.toggle('on',n===i));
  document.querySelectorAll('.pane').forEach((p,n)=>p.classList.toggle('on',n===i));
  $('pill').style.transform=`translate3d(${i*100}%,0,0)`;
}

/* ===== FREUNDE ===== */
function addFriendPrompt(){
  const n=(prompt('Benutzername deines Freundes:')||'').trim().toLowerCase();
  if(!n)return;
  if(n===me)return alert('Das bist du selbst 🙂');
  if(friends.includes(n))return alert(n+' ist bereits dein Freund.');
  friends.push(n);setFriends(friends);drawFriends();
  net.publish(T_FRIEND,JSON.stringify({from:me,to:n}));
  sysToast(n+' hinzugefügt');
}
function removeFriend(n){
  if(!confirm(n+' aus Freunden entfernen?'))return;
  friends=friends.filter(f=>f!==n);setFriends(friends);drawFriends();
}
function drawFriends(){
  const el=$('friendList');if(!el)return;
  if(!friends.length){el.innerHTML='<div class="empty">Noch keine Freunde.<br>Tippe oben auf „+ Freund hinzufügen"<br>und gib seinen Benutzernamen ein.</div>';return;}
  el.innerHTML='';
  friends.slice().sort().forEach(u=>{
    const on=users.has(u);
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<div class="avatar ${on?'':'off'}">${esc(u[0].toUpperCase())}</div>
      <div class="meta"><h4>${esc(u)}</h4><span>${on?'online':'offline'}</span></div>
      <div class="dot ${on?'':'off'}"></div>
      <button class="pill gray" style="margin-left:6px;">✕</button>`;
    d.querySelector('.meta').onclick=()=>openDM(u);
    d.querySelector('.avatar').onclick=()=>openDM(u);
    d.querySelector('.pill').onclick=e=>{e.stopPropagation();removeFriend(u);};
    el.appendChild(d);
  });
}
function drawUsers(){
  const el=$('userList');if(!el)return;
  const others=[...users.keys()].filter(u=>!friends.includes(u)).sort();
  if(!others.length){el.innerHTML='<div class="empty">Niemand Neues online.</div>';return;}
  el.innerHTML='';
  others.forEach(u=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<div class="avatar">${esc(u[0].toUpperCase())}</div>
      <div class="meta"><h4>${esc(u)}</h4><span>online</span></div>
      <button class="pill">+ Freund</button>`;
    d.querySelector('.pill').onclick=()=>{friends.push(u);setFriends(friends);
      net.publish(T_FRIEND,JSON.stringify({from:me,to:u}));drawFriends();drawUsers();sysToast(u+' hinzugefügt');};
    el.appendChild(d);
  });
}
function drawRooms(){
  const el=$('roomList');if(!el)return;
  if(!rooms.size){el.innerHTML='<div class="empty">Keine aktiven Räume.<br>Erstelle den ersten!</div>';return;}
  el.innerHTML='';
  [...rooms.values()].sort((a,b)=>a.name.localeCompare(b.name)).forEach(r=>{
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<div class="avatar">${r.lock?'🔒':'#'}</div>
      <div class="meta"><h4>${esc(r.name)}</h4><span>${r.lock?'Passwortgeschützt':'Öffentlich'}</span></div>
      <button class="pill">Beitreten</button>`;
    d.querySelector('.pill').onclick=()=>{let p='';
      if(r.lock){p=prompt('Passwort für "'+r.name+'":');if(p===null)return;}openRoom(r.name,p);};
    el.appendChild(d);
  });
}

/* ===== CHAT ÖFFNEN ===== */
function createRoom(){const n=$('crName').value.trim();if(!n)return alert('Bitte Raum-Namen eingeben.');
  openRoom(n,$('crPass').value);}
function joinTyped(){const n=$('jnName').value.trim();if(!n)return alert('Bitte Raum-Namen eingeben.');
  openRoom(n,$('jnPass').value);}
async function openRoom(name,pass){
  chatMode='room';chatTopic=NS+'/r/'+await sha(name.toLowerCase()+'##'+(pass||''));
  startChat((pass?'🔒 ':'# ')+name);
  net.subscribe(chatTopic);net.publish(T_ROOMS,JSON.stringify({name,lock:!!pass}));
  pub({k:'pres',a:'join'});$('btnMembers').style.display='flex';
}
async function openDM(other){
  chatMode='dm';chatTopic=NS+'/d/'+await sha([me,other].sort().join('<>'));
  startChat('💬 '+other);net.subscribe(chatTopic);pub({k:'pres',a:'join'});
  $('btnMembers').style.display='none';
}
function startChat(title){
  members.clear();members.set(me,Date.now());
  $('chTitle').textContent=title;$('msgs').innerHTML='';
  cancelReply();cancelAtt();tray.classList.remove('on');updateSub();drawMembers();show('scChat');
}
function leaveChat(){pub({k:'pres',a:'left'});if(chatTopic)net.unsubscribe(chatTopic);
  chatTopic='';openDrawer(false);show('scHome');}

/* ===== NACHRICHTEN ===== */
function pub(o){if(!net||!chatTopic)return;o.u=me;
  o.ts=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  net.publish(chatTopic,JSON.stringify(o));}
function typingPing(){clearTimeout(tTimer);tTimer=setTimeout(()=>pub({k:'typ'}),180);}
function send(){const i=$('msgIn'),v=i.value.trim();if(!v&&!att)return;
  pub({k:'msg',id:'m'+Date.now(),type:att?att.type:'text',text:v,media:att?att.url:null,
    re:reply?{u:reply.u,t:reply.t}:null});
  i.value='';cancelReply();cancelAtt();tray.classList.remove('on');}
function onChat(d){
  if(d.k==='pres'){if(d.u===me)return;
    if(d.a==='join'){if(!members.has(d.u))sys(d.u+' ist beigetreten');members.set(d.u,Date.now());pub({k:'pres',a:'here'});}
    if(d.a==='here')members.set(d.u,Date.now());
    if(d.a==='left'){members.delete(d.u);sys(d.u+' hat den Chat verlassen');}
    drawMembers();updateSub();return;}
  if(d.k==='typ'){if(d.u!==me)showTyping(d.u);return;}
  if(d.k==='msg')bubble(d);
}
function showTyping(u){const s=$('chSub');s.textContent='✍️ '+u+' schreibt…';s.dataset.t='1';
  clearTimeout(showTyping._t);showTyping._t=setTimeout(()=>{s.dataset.t='';updateSub();},2200);}
function updateSub(){const s=$('chSub');if(s.dataset.t==='1')return;
  s.textContent=chatMode==='dm'?'● privater Chat':'● '+members.size+' Teilnehmer';}
function drawMembers(){const el=$('memList');if(!el)return;el.innerHTML='';
  [...members.keys()].sort().forEach(u=>{const d=document.createElement('div');d.className='item';
    d.innerHTML=`<div class="avatar">${esc(u[0].toUpperCase())}</div>
      <div class="meta"><h4>${esc(u)}${u===me?' (Du)':''}</h4><span>online</span></div><div class="dot"></div>`;
    el.appendChild(d);});}
function openDrawer(b){$('drawer').classList.toggle('on',b);}
function sys(t){const b=$('msgs'),d=document.createElement('div');d.className='sys';d.textContent=t;
  b.appendChild(d);b.scrollTop=b.scrollHeight;}
function bubble(d){
  const box=$('msgs'),mine=d.u===me,r=document.createElement('div');
  r.className='row '+(mine?'me':'you');
  let q=d.re?`<div class="quote"><b>${esc(d.re.u)}</b>${esc(d.re.t)}</div>`:'';
  let m='',prev=d.text||'Anhang';
  if(d.type==='image')m=`<img src="${d.media}">`;
  else if(d.type==='video')m=`<video src="${d.media}" controls playsinline></video>`;
  else if(d.type==='audio'){prev='🎙 Sprachnachricht';m=`🎙 Sprachnachricht<audio src="${d.media}" controls playsinline></audio>`;}
  r.innerHTML=`${!mine&&chatMode==='room'?`<div class="who">${esc(d.u)} · ${d.ts}</div>`:''}
    <div class="bwrap"><div class="bub">${q}${d.text?`<div>${esc(d.text)}</div>`:''}${m}</div>
    <button class="rbtn">↩︎</button></div>`;
  r.querySelector('.rbtn').onclick=()=>setReply(d.u,prev);
  box.appendChild(r);box.scrollTop=box.scrollHeight;
}
function setReply(u,t){reply={u,t};$('rpWho').textContent='Antwort an '+u;$('rpTxt').textContent=t;
  $('replyBar').classList.add('on');$('msgIn').focus();}
function cancelReply(){reply=null;$('replyBar').classList.remove('on');}

/* ===== MEDIEN ===== */
function pickFile(inp){const f=inp.files[0];if(!f)return;
  if(f.type.startsWith('image/')){const rd=new FileReader();
    rd.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');
      let w=im.width,h=im.height,M=1000;
      if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M}else{w=Math.round(w*M/h);h=M}}
      c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
      setAtt('image',c.toDataURL('image/jpeg',.7),f.name);};im.src=e.target.result;};
    rd.readAsDataURL(f);}
  else if(f.type.startsWith('video/')){if(f.size>5e6)return alert('Video darf max. 5 MB groß sein.');
    const rd=new FileReader();rd.onload=e=>setAtt('video',e.target.result,f.name);rd.readAsDataURL(f);}
  inp.value='';}
function setAtt(type,url,name){att={type,url,name};
  $('attThumb').innerHTML=type==='image'?`<img src="${url}" class="thumb">`:`<div class="thumb">🎬</div>`;
  $('attName').textContent=name;$('attBar').classList.add('on');}
function cancelAtt(){att=null;$('attBar').classList.remove('on');}
async function toggleMic(){const b=$('micBtn');
  if(!recording){try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const o=MediaRecorder.isTypeSupported('audio/mp4')?{mimeType:'audio/mp4'}:{};
    rec=new MediaRecorder(st,o);chunks=[];
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    rec.onstop=()=>{const bl=new Blob(chunks,{type:rec.mimeType||'audio/mp4'}),rd=new FileReader();
      rd.onload=()=>{pub({k:'msg',id:'m'+Date.now(),type:'audio',media:rd.result,
        re:reply?{u:reply.u,t:reply.t}:null});cancelReply();};
      rd.readAsDataURL(bl);st.getTracks().forEach(t=>t.stop());};
    rec.start();recording=true;b.classList.add('rec');b.textContent='⏹';
  }catch(e){alert('Mikrofon-Zugriff verweigert.');}}
  else{rec.stop();recording=false;b.classList.remove('rec');b.textContent='🎙';}}
</script>
