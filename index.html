<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexus">
<title>Nexus Chat 12.0</title>
<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{--bg:#070b14;--panel:rgba(20,27,45,.82);--line:rgba(255,255,255,.09);
--primary:#6366f1;--accent:#22d3ee;--green:#10b981;--red:#ef4444;--gold:#f59e0b;
--txt:#f1f5f9;--muted:#8b98ad;--st:env(safe-area-inset-top,20px);--sb:env(safe-area-inset-bottom,16px);
--ease:cubic-bezier(.22,1,.36,1);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overscroll-behavior:none;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
background:var(--bg);color:var(--txt);overflow:hidden;-webkit-font-smoothing:antialiased;}
body::before{content:"";position:fixed;inset:0;z-index:-1;
background:radial-gradient(900px 600px at 50% -10%,#2b2a6e 0%,transparent 60%),
radial-gradient(700px 500px at 100% 100%,#0e4a5e 0%,transparent 55%),var(--bg);}
button,input,textarea{font-family:inherit;}button{cursor:pointer;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;opacity:0;transform:scale(.98);
pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease);}
.screen.active{opacity:1;transform:none;pointer-events:auto;}
.center{display:flex;align-items:center;justify-content:center;padding:22px;height:100%;overflow-y:auto;}
.card{width:100%;max-width:410px;padding:30px 26px;border-radius:28px;background:var(--panel);
border:1px solid var(--line);backdrop-filter:blur(28px) saturate(160%);
-webkit-backdrop-filter:blur(28px) saturate(160%);box-shadow:0 30px 70px rgba(0,0,0,.55);}
.logo{font-size:30px;font-weight:800;text-align:center;letter-spacing:-.5px;
background:linear-gradient(120deg,#a5b4fc,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{text-align:center;color:var(--muted);font-size:13.5px;margin:6px 0 20px;line-height:1.55;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 0 6px 4px;
letter-spacing:.3px;text-transform:uppercase;}
.inp{width:100%;padding:13px 16px;border-radius:15px;font-size:16px;color:#fff;outline:none;
background:rgba(8,12,22,.7);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s;}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(34,211,238,.12);}
.btn{width:100%;padding:15px;border:none;border-radius:15px;font-size:15.5px;font-weight:700;color:#fff;
background:linear-gradient(120deg,var(--primary),var(--accent));box-shadow:0 10px 26px rgba(99,102,241,.35);
margin-top:8px;transition:transform .14s var(--ease),filter .2s;}
.btn:active{transform:scale(.97);}
.btn.ghost{background:rgba(255,255,255,.07);box-shadow:none;border:1px solid var(--line);}
.topbar{padding:calc(var(--st) + 10px) 18px 12px;display:flex;align-items:center;justify-content:space-between;
background:rgba(8,12,22,.72);backdrop-filter:blur(22px);border-bottom:1px solid var(--line);flex-shrink:0;}
.topbar h2{font-size:18px;font-weight:750;}
.me{font-size:11.5px;color:var(--accent);}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);
color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;}
.body{flex:1;overflow-y:auto;padding:18px 16px 28px;}
.tabbar{display:flex;gap:4px;padding:6px;margin:0 16px 14px;border-radius:18px;background:rgba(0,0,0,.35);
border:1px solid var(--line);position:relative;flex-shrink:0;}
.tab{flex:1;padding:11px 3px;border:none;background:transparent;color:var(--muted);font-size:12px;
font-weight:700;border-radius:14px;z-index:2;}
.tab.on{color:#fff;}
.pane{display:none;animation:fade .3s var(--ease);}
.pane.on{display:block;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.list{display:flex;flex-direction:column;gap:9px;}
.item{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:17px;
background:rgba(255,255,255,.045);border:1px solid var(--line);}
.avatar{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;
justify-content:center;font-weight:800;font-size:19px;color:#fff;
background:linear-gradient(135deg,var(--primary),var(--accent));}
.item .meta{flex:1;min-width:0;}
.item .meta h4{font-size:15px;font-weight:650;}
.item .meta .st{font-size:11px;color:var(--accent);}
.item .meta .st.off{color:var(--muted);}
.pill{padding:7px 12px;border-radius:11px;border:none;font-size:12px;font-weight:700;color:#fff;background:var(--primary);}
.secttl{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:4px 0 10px 4px;}

/* iPad / Wide Screen Layout Optimization */
@media (min-width: 768px) {
  .body { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .pane { grid-column: span 2; }
  #pane0 { display: none; grid-template-columns: 1fr 1fr; gap: 20px; }
  #pane0.on { display: grid; }
}
</style>
</head>
<body>

<div class="screen active" id="scAuth">
  <div class="center">
    <div class="card">
      <div class="logo">Nexus</div>
      <div class="sub">Melde dich an</div>
      <div class="field"><label>Benutzername</label>
        <input class="inp" id="auUser" placeholder="z. B. alex" maxlength="16"></div>
      <button class="btn" onclick="login()">Anmelden</button>
    </div>
  </div>
</div>

<div class="screen" id="scHome">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:11px;">
      <div class="avatar" id="meAv">👤</div>
      <div><h2>Nexus</h2><div class="me" id="myStatus">🏠 In der Lobby</div></div>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="iconbtn">🔔</button>
      <button class="iconbtn">🔑</button>
    </div>
  </div>
  <div class="tabbar">
    <button class="tab on" onclick="setTab(0)">Chats</button>
    <button class="tab" onclick="setTab(1)">Erstellen</button>
    <button class="tab" onclick="setTab(2)">Beitreten</button>
    <button class="tab" onclick="setTab(3)">🎮 Spiele</button>
  </div>
  <div class="body">
    <div class="pane on" id="pane0">
      <div>
        <div class="field"><label>Freund hinzufügen</label>
          <div style="display:flex;gap:7px;">
            <input class="inp" id="addName" placeholder="Benutzername">
            <button class="pill" onclick="addFriend()">Hinzufügen</button>
          </div>
        </div>
        <div class="secttl">Meine Freunde</div>
        <div class="list" id="friendList">
          <div class="item">
            <div class="avatar">👨‍💻</div>
            <div class="meta">
              <h4>denis</h4>
              <span class="st off">⚪️ Offline</span>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="secttl">Meine Räume</div>
        <div class="list" id="roomList">
          <div class="item">
            <div class="avatar">🎮</div>
            <div class="meta">
              <h4>Lobby Chat</h4>
              <span class="st">🏠 In der Lobby</span>
            </div>
            <button class="pill">Öffnen</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="pane" id="pane1">
      <div class="field"><label>Raum-Name</label><input class="inp" placeholder="z. B. Gaming Zone"></div>
      <button class="btn">Raum erstellen</button>
    </div>
    
    <div class="pane" id="pane2">
      <div class="field"><label>Raum-Code</label><input class="inp" placeholder="Code eingeben"></div>
      <button class="btn">Beitreten</button>
    </div>

    <div class="pane" id="pane3">
      <div class="secttl">Mini-Games</div>
      <div class="list">
        <div class="item">
          <div class="avatar">⭕</div>
          <div class="meta"><h4>Tic Tac Toe</h4><span class="st">Multiplayer</span></div>
          <button class="pill" onclick="challenge()">Herausfordern</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let client = null;
let username = "";

function login() {
  const val = document.getElementById("auUser").value.trim();
  if(!val) return;
  username = val;
  document.getElementById("scAuth").classList.remove("active");
  document.getElementById("scHome").classList.add("active");
  
  initMQTT();
}

function initMQTT() {
  // MQTT Verbindungsaufbau mit Last Will & Testament (für ehrlichen Offline-Status)
  const clientId = "nexus_" + username + "_" + Math.random().toString(16).substr(2, 8);
  const statusTopic = "nexus/status/" + username;
  
  client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
    clientId: clientId,
    will: {
      topic: statusTopic,
      payload: JSON.stringify({ state: "offline", text: "⚪️ Offline" }),
      qos: 1,
      retain: true
    }
  });

  client.on("connect", () => {
    // Sobald verbunden: Auf "In der Lobby" setzen
    client.publish(statusTopic, JSON.stringify({ state: "lobby", text: "🏠 In der Lobby" }), { retain: true });
  });
}

function setTab(idx) {
  document.querySelectorAll(".tab").forEach((t, i) => t.classList.toggle("on", i === idx));
  document.querySelectorAll(".pane").forEach((p, i) => p.classList.toggle("on", i === idx));
}

function challenge() {
  alert("Herausforderung gesendet! Der Gegner muss erst annehmen. Rematch ist erst nach Spielende möglich.");
}

function addFriend() {
  const f = document.getElementById("addName").value;
  if(f) alert("Anfrage an " + f + " gesendet!");
}
</script>
</body>
</html>
